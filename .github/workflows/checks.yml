name: Checks

# The shared gate before merging: the checks in root CLAUDE.md § Commands that need no AWS.
on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: |
            backend/api/go.sum
            backend/devserver/go.sum
            backend/adapter/go.sum
      - name: Build and vet the Lambdas
        run: |
          go -C backend/api build ./...
          go -C backend/api vet ./...
      - name: Test the Lambdas
        run: |
          go -C backend/api test ./...
      - name: Vet and test the devserver
        run: |
          go -C backend/devserver vet ./...
          go -C backend/devserver test ./...
      # B's Postgres tests start a throwaway container; the runner has Docker.
      - name: Vet and test the adapter layer (B)
        run: |
          go -C backend/adapter vet ./...
          go -C backend/adapter test ./...

  smoke:
    # Runs A's real Lambdas through the devserver and calls every route.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: |
            backend/api/go.sum
            backend/devserver/go.sum
            backend/adapter/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the backend
        run: backend/devserver/dev.sh --backend-only
      - name: Call every route
        run: backend/devserver/smoke.sh
      - name: Stop the backend
        if: always()
        run: backend/devserver/stop.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/clutter/package-lock.json
      - run: npm --prefix frontend/clutter ci
      - name: Type-check
        run: npx --prefix frontend/clutter tsc --noEmit -p frontend/clutter
      - name: Lint
        run: npm --prefix frontend/clutter run lint
      - name: Unit tests (Vitest)
        working-directory: frontend/clutter
        run: npx --no-install vitest run
      - name: Build
        run: npm --prefix frontend/clutter run build
        env:
          NEXT_PUBLIC_API_ENDPOINT: http://localhost:8787

  collaboration:
    # The live sync service. Its tests need no database and no running app.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/collaboration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/collaboration/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test

  docs-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        run: npx -y markdownlint-cli2@0.18.1 "**/*.md"
      - name: Shellcheck our scripts
        run: shellcheck -S warning .claude/hooks/*.sh backend/devserver/*.sh backend/devserver/devstack/*.sh backend/infra/*.sh backend/adapter/images/*.sh frontend/build-image.sh backend/collaboration/test/live/*.sh
      - name: Devserver script checks
        run: backend/devserver/test-scripts.sh
      - name: Deploy script checks
        run: backend/infra/test-deploy.sh
      - name: Hook tests
        run: .claude/hooks/test-hooks.sh
